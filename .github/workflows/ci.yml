name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: urlshortener
          POSTGRES_PASSWORD: urlshortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshortener -d urlshortener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      - name: Compile, test, and verify coverage
        run: gradle --no-daemon clean check

      - name: Production configuration smoke test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/urlshortener
          DB_USER: urlshortener
          DB_PASSWORD: urlshortener
          BASE_URL: http://localhost:8080
        run: |
          gradle --no-daemon bootRun > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          kill "$(cat app.pid)"

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
