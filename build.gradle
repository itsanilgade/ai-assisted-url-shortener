plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}
group = 'com.schwab.assignment'
version = '1.0.0'
java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}
tasks.named('test') { useJUnitPlatform(); finalizedBy tasks.named('jacocoTestReport') }
jacocoTestReport { dependsOn test; reports { xml.required = true; html.required = true; csv.required = false } }
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.50 } } }
}
tasks.named('check') { dependsOn jacocoTestCoverageVerification }
